services:
  postgres:
    image: postgres:16
    container_name: sprintup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sprintup}
      POSTGRES_USER: ${POSTGRES_USER:-sprintup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sprintup}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sprintup-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sprintup} -d $${POSTGRES_DB:-sprintup}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  sprintup-postgres-data:
    name: sprintup-postgres-data
